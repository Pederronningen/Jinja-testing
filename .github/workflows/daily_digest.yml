name: Daglig e-post og nyhetsdigest

on:
  schedule:
    - cron: "0 6 * * *"   # 08:00 CEST / 07:00 CET hver dag
  workflow_dispatch:        # Manuell kjøring fra GitHub Actions-fanen

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Kjør digest
        run: python digest.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DITTUTSTYR_USER: ${{ secrets.DITTUTSTYR_USER }}
          DITTUTSTYR_APP_PASSWORD: ${{ secrets.DITTUTSTYR_APP_PASSWORD }}
          GOOGLE_CALENDAR_ICS_URL: ${{ secrets.GOOGLE_CALENDAR_ICS_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
